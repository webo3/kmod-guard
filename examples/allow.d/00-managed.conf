# Default allow list for servers. Install as /etc/kmod-guard/allow.d/00-managed.conf
# (or let your configuration management write that file).
#
# Entries: module name, glob on the name (* and ?), or path:<prefix> of the
# module path under /lib/modules/<kver>/. Loaded modules and the dependencies
# of everything allowed are always kept and don't need to be listed.

# Hardware and platform drivers. udev loads them when a device matches;
# unprivileged syscalls can't reach them. Covers the EDAC and cpufreq probes
# VMs retry at every boot (amd64_edac, edac_mce_amd, powernow_k8, ...).
path:kernel/arch/x86/              # CPU crypto acceleration, kvm, msr, cpuid, rapl
path:kernel/drivers/acpi/
path:kernel/drivers/ata/
path:kernel/drivers/block/         # loop, virtio_blk, nbd, rbd, zram
path:kernel/drivers/char/hw_random/
path:kernel/drivers/char/ipmi/     # ipmitool on bare metal
path:kernel/drivers/char/tpm/
path:kernel/drivers/cpufreq/
path:kernel/drivers/crypto/        # hardware engines (ccp, qat)
path:kernel/drivers/edac/
path:kernel/drivers/firmware/      # qemu_fw_cfg, dmi_sysfs, efi_pstore
path:kernel/drivers/hid/
path:kernel/drivers/hv/
path:kernel/drivers/hwmon/
path:kernel/drivers/i2c/
path:kernel/drivers/input/
path:kernel/drivers/md/            # dm_snapshot, dm_thin_pool, raid (LVM snapshots, backups)
path:kernel/drivers/mfd/
path:kernel/drivers/net/ethernet/
path:kernel/drivers/net/hyperv/
path:kernel/drivers/net/mdio/
path:kernel/drivers/net/phy/
path:kernel/drivers/net/vmxnet3/
path:kernel/drivers/nvme/host/
path:kernel/drivers/platform/x86/
path:kernel/drivers/powercap/
path:kernel/drivers/scsi/          # includes sg for smartctl
path:kernel/drivers/thermal/
path:kernel/drivers/usb/host/
path:kernel/drivers/usb/storage/
path:kernel/drivers/virtio/
path:kernel/drivers/watchdog/
path:kernel/drivers/xen/
path:kernel/lib/                   # crc, compression, raid6 helpers; only loaded as dependencies
enclosure
virtio_net
xen_netfront

# Out-of-tree modules installed on purpose: DKMS, CloudLinux kmod-lve,
# backup agents (Acronis snapapi, ...)
path:extra/
path:updates/
path:weak-updates/

# Filesystems in normal use
autofs4
binfmt_misc
efivarfs
ext4
fat
fuse
isofs                              # cloud-init config drive
nls_*
overlay
quota_tree                         # ext4 quotas (cPanel, CloudLinux)
quota_v2
squashfs                           # snaps
vfat
xfs

# ss(8) socket diagnostics
inet_diag
raw_diag
tcp_diag
udp_diag
unix_diag

# Netfilter. fail2ban, CSF, Imunify360, pve-firewall and Docker autoload
# these the first time a rule references them (xt_set, xt_recent, ...).
arp_tables
arptable_*
ebt_*
ebtable_*
ebtables
ip6_tables
ip6t_*
ip6table_*
ip_set*
ip_tables
ipt_*
iptable_*
nf_*
nfnetlink*
nft_*
x_tables
xt_*
